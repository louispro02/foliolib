# FolioLib: one command to run it.
#
#   docker compose up -d --build
#   docker compose exec foliolib python main.py passwd        # create your login (typed in the terminal)
#   open http://localhost:8080
#
# Try it with synthetic data first (needs an empty database, i.e. before importing anything):
#   docker compose exec foliolib python main.py demo
#
# HTTPS: the session cookie is marked `Secure`, so browsers only keep it on https:// or on localhost. Reached over plain
# http:// from another machine, the login would silently loop. For anything beyond localhost, put a reverse proxy with TLS in
# front (Caddy, Traefik, Nginx...) and publish the port only to it. Example Caddyfile:
#
#   foliolib.example.com {
#       reverse_proxy foliolib:8080
#   }
#
# Your data (database, uploaded exports, login hash) lives in the `foliolib-data` volume. Back it up like any other data.
name: foliolib

services:
  foliolib:
    build: .
    image: foliolib:local
    container_name: foliolib
    restart: unless-stopped
    user: "1000:1000"
    read_only: true               # the application never writes outside /data and /tmp
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    environment:
      - TZ=${TZ:-UTC}             # used for "today" and the logs; set it to your own time zone, e.g. Europe/Paris
    ports:
      - "127.0.0.1:8080:8080"     # loopback only; see the HTTPS note above before exposing it
    volumes:
      - foliolib-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  foliolib-data:
