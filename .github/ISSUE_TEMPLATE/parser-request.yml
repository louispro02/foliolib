name: Parser request
description: Ask for native support of a broker's export, by sharing an anonymized sample of it.
title: "[Parser] <broker name>"
labels: ["parser request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A new parser can only be written from a **real sample of the broker's export**: guessing the format breaks on the first real file.

        ## ⚠️ This issue is public. Anonymize before you paste anything.

        A real export contains your name, your account numbers and your whole financial history. **Never attach or paste the original file.** Make a copy and change it as follows.

        | Change | Keep as it is |
        | --- | --- |
        | Your name, address, e-mail, phone number | The **column headers**, exactly |
        | Account, customer and order numbers, IBAN | The **order of the columns** and the **separator** |
        | **Amounts and quantities**: invent them | The **number format**: decimal separator, number of decimals, sign for outflows, thousands separator if any |
        | ISINs and names, if you do not want to reveal what you hold: use invented ones of the same length | The **date and time format** |
        | | The **wording** of every operation type (`Dividend`, `Achat`...), even if it looks odd |

        Do not delete or add rows or columns by hand beyond that: a parser must see what the broker really writes.

        FolioLib reads **CSV files only**, not PDF or Excel. If your broker offers nothing else, you can still convert your data to the [generic CSV](https://github.com/louispro02/foliolib/blob/main/docs/generic-csv.md), which works for any broker today.
  - type: input
    id: broker
    attributes:
      label: Broker and country
      description: The broker's name and the country of your account, because exports often differ by country.
      placeholder: "Example: Acme Invest, France"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: What does the broker let you export?
      options:
        - A CSV file
        - An Excel file (.xlsx or .xls) only
        - PDF statements only
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where is the export, and what are its options?
      description: The menu path in the broker's website or app, the interface language you used, and any option that changes the columns (period, account type, file type).
      placeholder: "Example: Website > My account > History > Export > CSV, interface in English, period 'All'"
    validations:
      required: true
  - type: textarea
    id: header
    attributes:
      label: The header line, exactly as the file has it
      description: The first line of the file, copied without any change. If there are several kinds of files (transactions, cash account...), give one header per kind and say which is which.
      render: text
    validations:
      required: true
  - type: textarea
    id: rows
    attributes:
      label: Anonymized sample rows
      description: |
        A few rows for **each kind of operation** the file contains, anonymized as explained above: ideally a purchase, a sale, a dividend, a fee, a deposit and a withdrawal, plus a stock split or an exchange of shares if you ever had one. Say which row is which.

        Rows that are awkward are the most useful ones: a dividend with a tax, a purchase in a foreign currency, a corrected or cancelled operation.
      render: text
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you know about the file
      description: Anything about the format that the rows do not show. Leave empty if you do not know.
      placeholder: |
        - Separator: ; (semicolon)
        - Decimal separator: , (comma)
        - Encoding: opens correctly in Excel only with "Latin-1"
        - Is there an ISIN column? A cash balance column? A currency column?
        - Are purchase fees included in the amount or in a separate column?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I did not paste or attach the original export, only a copy that I anonymized.
          required: true
        - label: I replaced my name, address, account numbers, IBAN and every amount, and kept the headers and formats unchanged.
          required: true
        - label: I understand that this issue is public and anyone can read it.
          required: true
  - type: markdown
    attributes:
      value: |
        If you are comfortable with Python, you can write the parser yourself: see [CONTRIBUTING.md](https://github.com/louispro02/foliolib/blob/main/CONTRIBUTING.md#add-support-for-your-broker). A parser is one small file.
