name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # No dependency to install: FolioLib only uses the standard library.
      - name: Run the test suite
        run: python -I -W error::SyntaxWarning -m unittest discover tests -v

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff==0.17.5
      - name: Check
        run: ruff check app tests docs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (amd64) and load it for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: foliolib:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health check, non-root, read-only filesystem)
        run: |
          docker run -d --name foliolib-ci --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 foliolib:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz > /dev/null
          test "$(docker exec foliolib-ci id -u)" = "1000"
          docker stop foliolib-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' foliolib-ci)" = "0"
      - name: Build for every supported platform (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
